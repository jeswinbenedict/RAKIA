name: Flutter app

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"
  # Emscripten for the librakia WebAssembly module (core/dart/tool/build_wasm.sh).
  EMSDK_COMMIT: d7b4130688bfa348392b921ab04015aa15c4f154
  EMSCRIPTEN_VERSION: "6.0.13"

defaults:
  run:
    working-directory: app

jobs:
  checks:
    name: app analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: SQLite native libraries (cached; the sqlite3 build hook re-checks each pinned SHA-256)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.dart_tool/hooks_runner/shared/sqlite3/build/download-*
          key: sqlite3-native-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
      - run: flutter pub get
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Generated database code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib
      - name: Database schema export and migration test helpers are up to date
        run: |
          dart run drift_dev schema dump lib/storage/database.dart drift_schemas/
          dart run drift_dev schema generate drift_schemas/ test/generated_migrations/
          dart format test/generated_migrations
          git diff --exit-code -- drift_schemas test/generated_migrations
          test -z "$(git status --porcelain -- drift_schemas test/generated_migrations)"
      - name: Static analysis
        run: flutter analyze
      - name: Tests (design system, navigation, accessibility, analytics, local store)
        run: flutter test

  bindings-native:
    name: app bindings ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: core/dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: dart pub get
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test hook
      - name: Static analysis
        run: dart analyze --fatal-infos
      - name: Tests (librakia via dart:ffi, built by the build hook)
        run: dart test

  bindings-web:
    name: app bindings web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/dart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Emscripten
        working-directory: ${{ runner.temp }}
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          git checkout "$EMSDK_COMMIT"
          ./emsdk install "$EMSCRIPTEN_VERSION"
          ./emsdk activate "$EMSCRIPTEN_VERSION"
          echo "EMSDK_DIR=$PWD" >> "$GITHUB_ENV"
      - name: Build librakia WebAssembly (warnings are errors)
        run: |
          source "$EMSDK_DIR/emsdk_env.sh"
          sh tool/build_wasm.sh
          node tool/check_wasm.mjs build/wasm/rakia.wasm
      - run: dart pub get
      - name: Tests in Chrome, compiled to JavaScript
        run: dart test -p chrome
      - name: Tests in Chrome, compiled to WebAssembly
        run: dart test -p chrome --compiler dart2wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rakia-wasm
          path: core/dart/build/wasm/rakia.wasm
          if-no-files-found: error

  build:
    name: app build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            os: ubuntu-latest
            command: flutter build web --release --csp --no-web-resources-cdn
          - target: android
            os: ubuntu-latest
            command: flutter build apk --debug
          - target: ios
            os: macos-latest
            command: flutter build ios --debug --no-codesign
          - target: windows
            os: windows-latest
            command: flutter build windows --release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.target == 'android'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - if: matrix.target == 'android'
        name: Gradle distribution (cached; the wrapper checks its SHA-256)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties') }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: SQLite native libraries (cached; the sqlite3 build hook re-checks each pinned SHA-256)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.dart_tool/hooks_runner/shared/sqlite3/build/download-*
          key: sqlite3-native-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
      - if: matrix.target == 'web'
        name: SQLite WebAssembly (cached; the script re-checks its pinned SHA-256)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/web/sqlite3/sqlite3.wasm
          key: sqlite3-wasm-${{ hashFiles('app/tool/build_web_sqlite.sh') }}
      - if: matrix.target == 'web'
        name: Install Emscripten
        working-directory: ${{ runner.temp }}
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          git checkout "$EMSDK_COMMIT"
          ./emsdk install "$EMSCRIPTEN_VERSION"
          ./emsdk activate "$EMSCRIPTEN_VERSION"
          echo "EMSDK_DIR=$PWD" >> "$GITHUB_ENV"
      - if: matrix.target == 'web'
        name: Build librakia WebAssembly into the web app
        working-directory: core/dart
        run: |
          source "$EMSDK_DIR/emsdk_env.sh"
          sh tool/build_wasm.sh ../../app/web/rakia/rakia.wasm
      - run: flutter pub get
      - if: matrix.target == 'web'
        name: SQLite WebAssembly (pinned, checksum-verified) and the store worker
        run: sh tool/build_web_sqlite.sh
      - if: matrix.target == 'android'
        name: Gradle distribution (downloaded with retries; the wrapper checks its SHA-256)
        # The wrapper itself does not retry. A 5xx from GitHub's release
        # downloads should not fail the build, a wrong checksum still does,
        # and five failed attempts still fail the job.
        run: |
          flutter build apk --config-only
          cd android
          for attempt in 1 2 3 4 5; do
            ./gradlew --version --quiet && exit 0
            echo "Gradle distribution download failed (attempt $attempt of 5)" >&2
            sleep $((attempt * 30))
          done
          exit 1
      - name: Build
        run: ${{ matrix.command }}
      - if: matrix.target == 'web'
        name: The web build ships the analytics core and the local store
        run: |
          test -s build/web/rakia/rakia.wasm
          test -s build/web/sqlite3/sqlite3.wasm
          test -s build/web/sqlite3/drift_worker.js
          test -s build/web/canvaskit/canvaskit.wasm
          test -s build/web/_headers
      - if: matrix.target == 'web'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: matrix.target == 'web'
        name: The release build works under its own security headers (headless Chrome)
        run: |
          node tool/web/serve_with_headers.mjs build/web 5000 &
          sleep 1
          node tool/web/check_web_build.mjs http://127.0.0.1:5000/
