name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL c-cpp
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality
      - name: libpq for the API
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev
      - name: Build librakia and the API
        run: |
          cmake -S core -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          cmake -S server -B server/build -DCMAKE_BUILD_TYPE=Release -DRAKIA_API_BUILD_TESTS=OFF
          cmake --build server/build --parallel
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:c-cpp"
