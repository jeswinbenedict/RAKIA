name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Markdown and YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: No emoji in any tracked file
        run: node .github/scripts/check-no-emoji.mjs
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.0 "**/*.md" "#node_modules" "#_reference"
      - name: Validate YAML
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = 0
          for p in list(pathlib.Path('.github').rglob('*.yml')) + list(pathlib.Path('.github').rglob('*.yaml')):
              try:
                  yaml.safe_load(p.read_text(encoding='utf-8'))
              except yaml.YAMLError as e:
                  print(f'::error file={p}::{e}')
                  bad += 1
          sys.exit(1 if bad else 0)
          PY
