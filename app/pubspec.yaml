name: rakia
description: "RAKIA: offline-first, explainable astronaut health intelligence. Research software, not a medical device."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  go_router: ^18.1.3
  http: ^1.6.0
  path_provider: ^2.1.6
  rakia_core:
    path: ../core/dart
  sqlite3: ^3.9.0
  web: ^1.1.2

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt

  # Geist and Geist Mono (SIL OFL 1.1, see assets/fonts/OFL.txt), bundled so
  # the app renders identically offline.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-SemiBold.ttf
          weight: 600

# The native store is encrypted at rest with SQLite3 Multiple Ciphers (MIT),
# using the prebuilt, checksum-verified binaries of the locked `sqlite3`
# package release. See docs/DEVELOPMENT.md.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
