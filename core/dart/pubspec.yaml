name: rakia_core
description: "Dart bindings for librakia, RAKIA's portable C11 analytics core (dart:ffi on native, WebAssembly on the web). Research software, not a medical device."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.5
dependencies:
  code_assets: ^2.1.0
  ffi: ^2.2.0
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.5
dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
