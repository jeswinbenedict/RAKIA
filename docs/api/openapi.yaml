openapi: 3.1.0
info:
  title: RAKIA API
  version: 0.1.0
  summary: Offline-first astronaut health monitoring. Research software, not a medical device.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    The endpoints implemented so far. Sync and ingest are added by later
    releases; this file is updated with each. Authenticated endpoints take a
    Firebase ID token as a bearer token; the API verifies it against
    Google's published keys and then acts as that user, with row-level
    security in the database.

    Every response carries `X-Request-Id` (a caller may supply one of 8 to
    64 characters of `[A-Za-z0-9-]`), security headers, and
    `Cache-Control: no-store`. Requests from origins on the configured
    allow-list receive CORS headers. Errors use the `Error` schema. Requests
    other than the health and readiness probes are rate-limited per client
    address.
security:
  - firebase: []
servers:
  - url: http://127.0.0.1:8080
    description: Local development
paths:
  /v1/health:
    get:
      summary: Liveness
      description: The process is up. Does not touch the database.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: {const: ok}
                  version: {type: string, examples: ['0.1.0']}
  /v1/ready:
    get:
      summary: Readiness
      description: |
        The database is reachable as the API role and its schema is the
        version this build expects.
      operationId: getReady
      security: []
      responses:
        '200':
          description: Ready to serve.
          content:
            application/json:
              schema:
                type: object
                required: [status, schema_version]
                properties:
                  status: {const: ready}
                  schema_version: {type: integer, examples: [2]}
        '503':
          description: |
            Not ready: `database_unavailable`, `schema_unavailable` (not
            migrated) or `schema_mismatch`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/metric-definitions:
    get:
      summary: Indicators RAKIA understands
      description: Reference data; contains no personal or health data.
      operationId: listMetricDefinitions
      security: []
      responses:
        '200':
          description: All indicators, ordered by code.
          content:
            application/json:
              schema:
                type: object
                required: [metric_definitions]
                properties:
                  metric_definitions:
                    type: array
                    items: {$ref: '#/components/schemas/MetricDefinition'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503':
          description: The database is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/space-weather:
    get:
      summary: Live space-radiation environment (NOAA SWPC)
      description: >-
        GOES >=10 MeV integral proton flux for the last day, the current NOAA solar radiation
        storm level (S-scale) and the latest planetary K index, retrieved from the NOAA Space
        Weather Prediction Center and refreshed every five minutes. This is the environment near
        Earth (geostationary orbit), not a dose received by any person. When NOAA cannot be
        reached, the last retrieved snapshot is served with `stale: true` for up to six hours;
        after that the endpoint answers 503 rather than inventing data.
      operationId: getSpaceWeather
      security: []
      responses:
        '200':
          description: The latest snapshot, with source and timestamps.
          headers:
            Cache-Control:
              schema: {type: string, example: 'public, max-age=60'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpaceWeather'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503':
          description: Live space weather is unavailable or not configured.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/me:
    get:
      summary: The signed-in user's account and mission roles
      description: |
        Returns the account with the missions the user belongs to and their
        roles; health data is not part of this response. Never creates the
        account: use POST.
      operationId: getMe
      responses:
        '200':
          description: The account and memberships.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountWithRoles'}
        '404':
          description: The sign-in is valid but has no RAKIA account yet (`no_account`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503':
          description: Sign-in is not configured on this server, or the database is unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      summary: Create the signed-in user's account
      description: |
        Creates the RAKIA account of a verified Firebase user, after a
        Cloudflare Turnstile check: the app sends the token from a widget
        rendered with action `create-account`. The API verifies it with
        Cloudflare (siteverify), checks the hostname it was solved on and the
        action, refuses Cloudflare's always-pass testing keys outside
        development, and records the token's SHA-256 for ten minutes so it
        cannot be replayed. Turnstile is bot friction, not identity. If the
        account already exists it is returned without a check.
      operationId: createMe
      parameters:
        - name: X-Turnstile-Token
          in: header
          required: false
          description: Turnstile token; required unless the account already exists.
          schema: {type: string, maxLength: 2048}
      responses:
        '200':
          description: The account already existed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountWithRoles'}
        '201':
          description: The account was created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountWithRoles'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: The Turnstile check did not pass (`turnstile_failed`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503':
          description: >-
            Sign-in is not configured, the database is unavailable, Cloudflare could not be
            reached (`turnstile_unavailable`), or this server has no Turnstile secret and is not
            in development (`account_creation_not_configured`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
components:
  securitySchemes:
    firebase:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Firebase ID token, verified by the API against Google's public
        keys. Endpoints marked `security: []` are public.
  schemas:
    AccountWithRoles:
      type: object
      required: [user, memberships]
      properties:
        user:
          type: object
          required: [id, firebase_uid, display_name, created_at]
          properties:
            id: {type: string, format: uuid}
            firebase_uid: {type: string}
            display_name: {type: [string, 'null']}
            created_at: {type: string, format: date-time}
        memberships:
          type: array
          items:
            type: object
            required: [mission_id, mission_name, is_simulation, role]
            properties:
              mission_id: {type: string, format: uuid}
              mission_name: {type: string}
              is_simulation: {type: boolean}
              role:
                type: string
                enum: [astronaut, crew_medical_officer, flight_surgeon, researcher, mission_admin]
    MetricDefinition:
      type: object
      required: [code, name, unit, ucum, plausible_min, plausible_max]
      properties:
        code: {type: string, examples: [heart_rate.resting]}
        name: {type: string, examples: [Resting heart rate]}
        unit: {type: string, description: Unit as recorded and displayed, examples: [bpm]}
        ucum: {type: string, description: UCUM code of the unit, examples: [/min]}
        plausible_min: {type: number}
        plausible_max: {type: number}
    SpaceWeather:
      type: object
      required: [source, retrieved_at, stale, proton_flux_10mev, radiation_storm, geomagnetic]
      properties:
        source:
          type: object
          required: [name, url, satellite, note]
          properties:
            name: {type: string, example: NOAA Space Weather Prediction Center}
            url: {type: string, format: uri}
            satellite: {type: string, example: GOES-18}
            note: {type: string}
        retrieved_at: {type: string, format: date-time}
        stale: {type: boolean, description: True when NOAA could not be reached on the last refresh.}
        proton_flux_10mev:
          type: object
          required: [unit, s1_threshold, latest, points]
          properties:
            unit: {type: string, enum: [pfu]}
            s1_threshold: {type: number, description: NOAA S1 storm threshold in this channel.}
            latest: {$ref: '#/components/schemas/FluxPoint'}
            points:
              type: array
              description: Five-minute values for the last day, oldest first.
              items: {$ref: '#/components/schemas/FluxPoint'}
        radiation_storm:
          type: object
          required: [scale, level, text, observed_at]
          properties:
            scale: {type: string, example: S0}
            level: {type: integer, minimum: 0, maximum: 5}
            text: {type: string, example: none}
            observed_at: {type: string, format: date-time}
        geomagnetic:
          type: object
          required: [kp, observed_at]
          properties:
            kp: {type: number, minimum: 0, maximum: 9}
            observed_at: {type: string, format: date-time}
    FluxPoint:
      type: object
      required: [time, flux]
      properties:
        time: {type: string, format: date-time}
        flux: {type: number, minimum: 0}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              examples: [not_found, rate_limited, database_unavailable, internal_error]
            message: {type: string}
            request_id: {type: string}
  responses:
    Unauthenticated:
      description: |
        No bearer token (`unauthenticated`), or a token that is expired,
        not signed by Google for this project, or otherwise invalid
        (`invalid_token`). Carries a `WWW-Authenticate: Bearer` challenge.
      headers:
        WWW-Authenticate:
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: Too many requests from this client address.
      headers:
        Retry-After:
          description: Seconds until a request will be accepted.
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
